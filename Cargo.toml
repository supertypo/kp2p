[package]
name = "kp2p"
rust-version = "1.96.0"
edition = "2024"
build = "build.rs"

[profile.dev]
panic = "abort"

[profile.release]
lto = "thin"
strip = true
overflow-checks = true
panic = "abort"

[build-dependencies]
vergen-git2 = "1.0.7"

[dependencies]
kaspa-p2p-lib = { git = "https://github.com/kaspanet/rusty-kaspa.git", tag = "tn10-toc3" }
kaspa-consensus-core = { git = "https://github.com/kaspanet/rusty-kaspa.git", tag = "tn10-toc3" }
kaspa-hashes = { git = "https://github.com/kaspanet/rusty-kaspa.git", tag = "tn10-toc3" }
kaspa-utils = { git = "https://github.com/kaspanet/rusty-kaspa.git", tag = "tn10-toc3" }
kaspa-addresses = { git = "https://github.com/kaspanet/rusty-kaspa.git", tag = "tn10-toc3" }
kaspa-txscript = { git = "https://github.com/kaspanet/rusty-kaspa.git", tag = "tn10-toc3" }
clap = { version = "4.6.1", features = ["derive"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread"] }
tonic = { version = "0.14.6", features = ["tls", "gzip"] }
itertools = "0.14.0"
uuid = { version = "1.23.1", features = ["v4"] }
rustls = { version = "0.23.37", default-features = false, features = ["tls-ring"] }
chrono = { version = "0.4.44", features = ["serde"] }
serde_json = "1.0.150"
serde = { version = "1.0.228", features = ["derive"] }
serde_with = { version = "3.20.0", features = ["hex", "macros"] }
hex = "0.4.3"
